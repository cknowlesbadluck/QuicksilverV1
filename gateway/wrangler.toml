# Mercury Gateway — Cloudflare Workers Free scaffold (M3-T15).
# Free tier only: no KV, R2, D1, Queues, AI, or other paid bindings.
# Workers AI binding arrives in M3-T19. DEVICE_TOKEN is a secret set at HG3
# (`wrangler secret put DEVICE_TOKEN`); never put it here. Limits are in-isolate
# counters (src/limits.ts), so no rate-limit or storage bindings.

name = "mercury-gateway"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

# Observability: invocation metadata (method, path, status, timing) only.
# Never log request/response bodies — handlers must not console.log payloads.
[observability]
enabled = true
head_sampling_rate = 1
# Strip query strings from logged request URLs (metadata-only contract).
redact_query_string = true

[observability.logs]
invocation_logs = true
