name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build IPA without creating a GitHub Release"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: SideStore IPA (+ optional TestFlight)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen || brew upgrade xcodegen || true

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          test -d Quicksilver.xcodeproj

      - name: SPM unit tests
        run: |
          set -euo pipefail
          swift test 2>&1 | tee spm-test.log

      - name: Check signing secrets
        id: signing
        run: |
          if [[ -n "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" && \
                -n "${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}" && \
                -n "${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}" ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No ASC secrets — unsigned SideStore IPA only."
          fi

      - name: Archive unsigned IPA (SideStore)
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project Quicksilver.xcodeproj \
            -scheme Quicksilver \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee build/archive.log

          APP_PATH=$(find DerivedData -name "Quicksilver.app" -type d | head -n 1)
          test -n "$APP_PATH"

          # Fail the release if the asset catalog did not compile the configured app icon.
          test -s "$APP_PATH/Assets.car"
          ICON_NAME=$(plutil -extract CFBundleIcons.CFBundlePrimaryIcon.CFBundleIconName raw -o - "$APP_PATH/Info.plist")
          test "$ICON_NAME" = "AppIcon"

          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -r Quicksilver-unsigned.ipa Payload)
          ls -lh build/Quicksilver-unsigned.ipa
          unzip -l build/Quicksilver-unsigned.ipa | grep -q "Payload/Quicksilver.app"
          unzip -l build/Quicksilver-unsigned.ipa | grep -q "Payload/Quicksilver.app/Assets.car"
          unzip -l build/Quicksilver-unsigned.ipa | grep -q "Payload/Quicksilver.app/Info.plist"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          generate_release_notes: true
          files: build/Quicksilver-unsigned.ipa

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ github.ref_name }}
          path: |
            build/*.ipa
            build/*.log
            spm-test.log
          retention-days: 30
