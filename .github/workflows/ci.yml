name: Quicksilver CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  structure:
    name: Structure & Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify modular layout
        run: |
          set -euo pipefail
          echo "== Required directories =="
          for d in App Core Personas Nexus UI Memory Services Tests Documentation Intents Resources; do
            if [[ ! -d "$d" ]]; then
              echo "::error::Missing required directory: $d/"
              exit 1
            fi
            echo "  OK  $d/"
          done

          echo "== Core contracts =="
          for f in \
            Core/Protocols/AIProvider.swift \
            Core/Protocols/MemoryStore.swift \
            Core/Protocols/DiagnosticProvider.swift \
            Core/Protocols/PersonaEngine.swift \
            Core/Protocols/AutomationProvider.swift \
            Core/Models/AIRequest.swift \
            Core/Models/AIResponse.swift \
            Core/Models/MemoryItem.swift \
            Core/Models/SanctumChamber.swift \
            Package.swift \
            project.yml \
            App/QuicksilverApp.swift \
            App/DependencyContainer.swift \
            Nexus/NexusCoordinator.swift \
            UI/ContentView.swift \
            Documentation/ARCHITECTURE.md \
            PrivacyInfo.xcprivacy
          do
            if [[ ! -f "$f" ]]; then
              echo "::error::Missing required file: $f"
              exit 1
            fi
            echo "  OK  $f"
          done
          echo "Structure and contracts verified."

  lint:
    name: SwiftLint
    runs-on: macos-15
    needs: structure
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install SwiftLint
        run: brew install swiftlint || brew upgrade swiftlint || true

      - name: Run SwiftLint on changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          if [[ -z "${BASE_SHA:-}" ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA=$(git rev-parse HEAD^)
          fi

          CHANGED_SWIFT_FILES=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" -- '*.swift')
          if [[ -z "$CHANGED_SWIFT_FILES" ]]; then
            echo "No changed Swift files to lint."
            exit 0
          fi

          FILES=()
          while IFS= read -r file; do
            FILES+=("$file")
          done <<< "$CHANGED_SWIFT_FILES"

          printf 'Linting changed Swift file: %s\n' "${FILES[@]}"
          swiftlint lint --reporter github-actions-logging --strict "${FILES[@]}"

  spm-test:
    name: SPM Unit Tests
    runs-on: macos-15
    needs: structure
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache SPM
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: spm-v3-${{ runner.os }}-${{ github.repository }}-${{ hashFiles('Package.swift', '**/Package.resolved') }}
          restore-keys: |
            spm-v3-${{ runner.os }}-${{ github.repository }}-

      - name: Resolve packages
        run: swift package resolve

      - name: Run tests
        run: |
          set -euo pipefail
          # Clean any stale ModuleCache that can break after path changes
          rm -rf .build/arm64-apple-macosx/debug/ModuleCache 2>/dev/null || true
          swift test --enable-code-coverage 2>&1 | tee spm-test.log

      - name: Summarize test results
        if: always()
        run: |
          echo "=== SPM Test Summary ==="
          grep -E "Test Suite|passed|failed|error:|Executed" spm-test.log || true

      - name: Upload SPM logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spm-test-logs
          path: spm-test.log
          retention-days: 7

  ios-simulator-build:
    name: iOS Simulator Build
    runs-on: macos-15
    needs: [structure, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen + SwiftLint
        run: |
          set -euo pipefail
          brew install xcodegen swiftlint || true

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          test -d Quicksilver.xcodeproj

      - name: Cache DerivedData
        uses: actions/cache@v6
        with:
          path: DerivedData
          key: deriveddata-v1-${{ runner.os }}-${{ hashFiles('project.yml', 'Package.swift', '**/*.swift') }}
          restore-keys: |
            deriveddata-v1-${{ runner.os }}-

      - name: Resolve destination (iPhone simulator)
        id: dest
        run: |
          set -euo pipefail
          echo "== Available simulators =="
          xcrun simctl list devices available || true

          DEST=""
          for name in "iPhone 16" "iPhone 16 Pro" "iPhone 15" "iPhone 15 Pro" "iPhone 14"; do
            if xcrun simctl list devices available | grep -q "$name"; then
              DEST="platform=iOS Simulator,name=$name"
              echo "Matched preferred device: $name"
              break
            fi
          done

          if [[ -z "$DEST" ]]; then
            UDID=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/' || true)
            if [[ -n "$UDID" ]]; then
              DEST="platform=iOS Simulator,id=$UDID"
              echo "Fell back to UDID: $UDID"
            fi
          fi

          if [[ -z "$DEST" ]]; then
            DEST="platform=iOS Simulator,name=iPhone 16"
            echo "No available device listed; using default name fallback"
          fi

          echo "destination=$DEST" >> "$GITHUB_OUTPUT"
          echo "Using destination: $DEST"

      - name: Build for iOS Simulator
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild \
            -project Quicksilver.xcodeproj \
            -scheme Quicksilver \
            -destination "${{ steps.dest.outputs.destination }}" \
            -derivedDataPath DerivedData \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log

      - name: Build diagnostics on failure
        if: failure()
        run: |
          echo "=== Last 80 lines of xcodebuild.log ==="
          tail -80 xcodebuild.log || true
          echo "=== Errors only ==="
          grep -E "error:|warning:|FAILED|fatal" xcodebuild.log | head -40 || true

      - name: Emit compiler errors as annotations
        if: failure()
        run: |
          set +e
          escape() {
            printf '%s' "$1" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e ':a;N;$!ba;s/\n/%0A/g'
          }
          COUNT=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            esc=$(escape "$line")
            echo "::error::${esc}"
            COUNT=$((COUNT+1))
            [ "$COUNT" -ge 15 ] && break
          done < <(grep -E "error:" xcodebuild.log | sort -u | head -15)
          echo "Emitted $COUNT annotation(s)."

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-build-logs
          path: |
            xcodebuild.log
            DerivedData/Logs
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload generated project on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: generated-xcodeproj
          path: Quicksilver.xcodeproj
          retention-days: 3
          if-no-files-found: ignore
