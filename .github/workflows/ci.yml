name: Quicksilver CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  structure:
    name: Structure & Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify modular layout
        run: |
          set -euo pipefail
          echo "== Required directories =="
          for d in App Core Personas Nexus UI Memory Services Tests Documentation Intents Resources; do
            if [[ ! -d "$d" ]]; then
              echo "::error::Missing required directory: $d/"
              exit 1
            fi
            echo "  OK  $d/"
          done

          echo "== Core contracts =="
          for f in \
            Core/Protocols/AIProvider.swift \
            Core/Protocols/MemoryStore.swift \
            Core/Protocols/DiagnosticProvider.swift \
            Core/Protocols/PersonaEngine.swift \
            Core/Protocols/AutomationProvider.swift \
            Core/Models/AIRequest.swift \
            Core/Models/AIResponse.swift \
            Core/Models/MemoryItem.swift \
            Core/Models/SanctumChamber.swift \
            Package.swift \
            project.yml \
            App/QuicksilverApp.swift \
            App/DependencyContainer.swift \
            Nexus/NexusCoordinator.swift \
            UI/ContentView.swift \
            Documentation/ARCHITECTURE.md \
            PrivacyInfo.xcprivacy
          do
            if [[ ! -f "$f" ]]; then
              echo "::error::Missing required file: $f"
              exit 1
            fi
            echo "  OK  $f"
          done
          echo "Structure and contracts verified."

  spm-test:
    name: SPM Unit Tests
    runs-on: macos-15
    needs: structure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          echo "Available Xcode apps:"
          ls /Applications | grep -i xcode || true
          SELECTED=""
          for candidate in \
            /Applications/Xcode_16.4.app \
            /Applications/Xcode_16.3.app \
            /Applications/Xcode_16.2.app \
            /Applications/Xcode_16.1.app \
            /Applications/Xcode_16.0.app \
            /Applications/Xcode_15.4.app \
            /Applications/Xcode.app
          do
            if [[ -d "$candidate" ]]; then
              SELECTED="$candidate"
              break
            fi
          done
          if [[ -z "$SELECTED" ]]; then
            echo "::error::No usable Xcode installation found"
            exit 1
          fi
          sudo xcode-select -s "$SELECTED"
          echo "Active developer dir: $(xcode-select -p)"
          xcodebuild -version
          swift --version

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          # Include repository name so path-renamed workspaces (Quicksilver → QuicksilverV1)
          # never restore a PCH built against a different absolute ModuleCache path.
          key: spm-v2-${{ runner.os }}-${{ github.repository }}-${{ hashFiles('Package.swift') }}
          restore-keys: |
            spm-v2-${{ runner.os }}-${{ github.repository }}-

      - name: Resolve packages
        run: swift package resolve

      - name: Run tests
        run: |
          set -euo pipefail
          # Drop any restored ModuleCache that still points at a previous workspace path.
          rm -rf .build/arm64-apple-macosx/debug/ModuleCache 2>/dev/null || true
          swift test --enable-code-coverage 2>&1 | tee spm-test.log

      - name: Summarize test results
        if: always()
        run: |
          echo "=== SPM Test Summary ==="
          grep -E "Test Suite|passed|failed|error:|Executed" spm-test.log || true

      - name: Upload SPM logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spm-test-logs
          path: spm-test.log
          retention-days: 7

  ios-simulator-build:
    name: iOS Simulator Build
    runs-on: macos-15
    needs: structure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          SELECTED=""
          for candidate in \
            /Applications/Xcode_16.4.app \
            /Applications/Xcode_16.3.app \
            /Applications/Xcode_16.2.app \
            /Applications/Xcode_16.1.app \
            /Applications/Xcode_16.0.app \
            /Applications/Xcode_15.4.app \
            /Applications/Xcode.app
          do
            if [[ -d "$candidate" ]]; then
              SELECTED="$candidate"
              break
            fi
          done
          if [[ -z "$SELECTED" ]]; then
            echo "::error::No usable Xcode installation found"
            exit 1
          fi
          sudo xcode-select -s "$SELECTED"
          echo "Active developer dir: $(xcode-select -p)"
          xcodebuild -version

      - name: Install XcodeGen + SwiftLint
        run: |
          set -euo pipefail
          brew install xcodegen swiftlint || true

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate

      - name: SwiftLint (report)
        run: |
          set -euo pipefail
          swiftlint lint --reporter github-actions-logging || true

      - name: Resolve destination (iPhone simulator)
        id: dest
        run: |
          set -euo pipefail
          echo "== Available simulators =="
          xcrun simctl list devices available || true

          # Prefer a concrete modern iPhone by name (most reliable on macos-15 runners).
          DEST=""
          for name in "iPhone 16" "iPhone 16 Pro" "iPhone 15" "iPhone 15 Pro" "iPhone 14"; do
            if xcrun simctl list devices available | grep -q "$name"; then
              DEST="platform=iOS Simulator,name=$name"
              echo "Matched preferred device: $name"
              break
            fi
          done

          # Fallback: first available iPhone by UDID
          if [[ -z "$DEST" ]]; then
            UDID=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/' || true)
            if [[ -n "$UDID" ]]; then
              DEST="platform=iOS Simulator,id=$UDID"
              echo "Fell back to UDID: $UDID"
            fi
          fi

          # Last resort: let xcodebuild choose any iPhone simulator
          if [[ -z "$DEST" ]]; then
            DEST="platform=iOS Simulator,name=iPhone 16"
            echo "No available device listed; using default name fallback"
          fi

          echo "destination=$DEST" >> "$GITHUB_OUTPUT"
          echo "Using destination: $DEST"

      - name: Build for iOS Simulator
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild \
            -project Quicksilver.xcodeproj \
            -scheme Quicksilver \
            -destination "${{ steps.dest.outputs.destination }}" \
            -derivedDataPath DerivedData \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log

      - name: Build diagnostics on failure
        if: failure()
        run: |
          echo "=== Last 80 lines of xcodebuild.log ==="
          tail -80 xcodebuild.log || true
          echo "=== Errors only ==="
          grep -E "error:|warning:|FAILED|fatal" xcodebuild.log | head -40 || true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build-logs
          path: |
            xcodebuild.log
            DerivedData/Logs
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload generated project on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-xcodeproj
          path: Quicksilver.xcodeproj
          retention-days: 3
          if-no-files-found: ignore
