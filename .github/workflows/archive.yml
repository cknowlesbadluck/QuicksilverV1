name: Archive IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug

concurrency:
  group: archive-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  archive:
    name: Archive & Export IPA (Unsigned + Optional Signed + Sentry dSYMs)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen || brew upgrade xcodegen || true

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          test -d Quicksilver.xcodeproj
          echo "Project generated successfully."

      - name: Print version banner
        run: |
          set -euo pipefail
          VERSION=$(grep -E 'MARKETING_VERSION:' project.yml | head -1 | sed 's/.*"\(.*\)"/\1/' || echo "0.1.0")
          BUILD=$(grep -E 'CURRENT_PROJECT_VERSION:' project.yml | head -1 | sed 's/.*"\(.*\)"/\1/' || echo "?")
          echo "========================================"
          echo " Quicksilver $VERSION (build $BUILD)"
          echo " Config: ${{ inputs.configuration }}"
          echo " SideStore path: unsigned IPA (primary)"
          echo "========================================"
          echo "::notice title=Quicksilver version::${VERSION} (build ${BUILD}) — ${{ inputs.configuration }}"

      - name: Check signing secrets
        id: signing
        run: |
          if [[ -n "${{ secrets.BUILD_CERTIFICATE_BASE64 }}" && -n "${{ secrets.P12_PASSWORD }}" && -n "${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Signing secrets detected — will also produce signed IPA."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets. Will produce unsigned IPA for SideStore re-signing."
          fi

      - name: Check Sentry secrets
        id: sentry
        run: |
          if [[ -n "${{ secrets.SENTRY_AUTH_TOKEN }}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Sentry auth token present — will upload debug symbols."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No SENTRY_AUTH_TOKEN. Skipping dSYM upload."
          fi

      - name: Install signing certificate & profile
        if: steps.signing.outputs.available == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          security create-keychain -p "${KEYCHAIN_PASSWORD:-temporary}" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD:-temporary}" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build (unsigned path)
        id: build
        run: |
          set -euo pipefail
          mkdir -p build/unsigned

          xcodebuild \
            -project Quicksilver.xcodeproj \
            -scheme Quicksilver \
            -configuration ${{ inputs.configuration }} \
            -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym \
            build \
            2>&1 | tee build-unsigned.log

          APP_PATH=$(find DerivedData -name "Quicksilver.app" -type d | head -n 1)
          if [[ -z "$APP_PATH" ]]; then
            echo "::error::Could not find Quicksilver.app after build"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

          # --- SideStore critical: verify persona prompts are embedded ---
          echo "Verifying persona prompt resources…"
          for persona in quicksilver forge eternal; do
            if [[ -f "$APP_PATH/Personas/${persona}.txt" ]] || [[ -f "$APP_PATH/${persona}.txt" ]]; then
              echo "  OK  ${persona}.txt present"
            else
              FOUND=$(find "$APP_PATH" -name "${persona}.txt" | head -n 1 || true)
              if [[ -n "$FOUND" ]]; then
                echo "  OK  ${persona}.txt found at $FOUND"
              else
                echo "::warning::Persona prompt ${persona}.txt not found inside app bundle — PromptManager will use embedded fallback"
              fi
            fi
          done

          # Verify Privacy Manifest if present
          if [[ -f "$APP_PATH/PrivacyInfo.xcprivacy" ]]; then
            echo "  OK  PrivacyInfo.xcprivacy present"
          else
            echo "::warning::PrivacyInfo.xcprivacy not found in app bundle"
          fi

          # Package as unsigned IPA (SideStore can re-sign this)
          mkdir -p build/unsigned/Payload
          cp -R "$APP_PATH" build/unsigned/Payload/
          cd build/unsigned
          zip -r ../Quicksilver-unsigned.ipa Payload
          cd ../..
          ls -lh build/Quicksilver-unsigned.ipa

          # Basic IPA structure check
          unzip -l build/Quicksilver-unsigned.ipa | grep -q "Payload/Quicksilver.app" || {
            echo "::error::IPA does not contain Payload/Quicksilver.app"
            exit 1
          }
          echo "Unsigned IPA created and structure verified."

      - name: Collect dSYMs
        id: dsyms
        run: |
          set -euo pipefail
          mkdir -p build/dSYMs
          # Find any dSYMs produced by the build
          find DerivedData -name "*.dSYM" -type d | while read -r dsym; do
            echo "Found dSYM: $dsym"
            cp -R "$dsym" build/dSYMs/
          done
          ls -la build/dSYMs || true
          if [[ -n "$(ls -A build/dSYMs 2>/dev/null)" ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "dSYMs collected."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No dSYMs found — symbolication will be limited."
          fi

      - name: Upload debug symbols to Sentry
        if: steps.sentry.outputs.available == 'true' && steps.dsyms.outputs.found == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG || 'inbetween' }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT || 'quicksilver' }}
        run: |
          set -euo pipefail
          echo "Installing sentry-cli…"
          curl -sL https://sentry.io/get-cli/ | bash
          export PATH="$HOME/.local/bin:$PATH"

          echo "Uploading dSYMs to Sentry (org=$SENTRY_ORG project=$SENTRY_PROJECT)…"
          sentry-cli debug-files upload \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT" \
            build/dSYMs

          echo "Sentry dSYM upload complete."

      - name: Archive + Export signed IPA (optional)
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project Quicksilver.xcodeproj \
            -scheme Quicksilver \
            -configuration ${{ inputs.configuration }} \
            -destination "generic/platform=iOS" \
            -archivePath build/Quicksilver.xcarchive \
            -derivedDataPath DerivedData-Signed \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym \
            archive \
            2>&1 | tee archive-signed.log

          cat > build/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string>${{ secrets.TEAM_ID }}</string>
            <key>compileBitcode</key>
            <false/>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/Quicksilver.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/ipa \
            2>&1 | tee export-signed.log
          ls -la build/ipa || true

      - name: Upload unsigned IPA (always)
        uses: actions/upload-artifact@v4
        with:
          name: Quicksilver-unsigned-IPA
          path: build/Quicksilver-unsigned.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Upload signed IPA (if available)
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Quicksilver-signed-IPA
          path: build/ipa/*.ipa
          retention-days: 14
          if-no-files-found: warn

      - name: Upload dSYMs artifact
        if: steps.dsyms.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Quicksilver-dSYMs
          path: build/dSYMs
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-unsigned.log
            archive-signed.log
            export-signed.log
            build/
          retention-days: 7
          if-no-files-found: ignore
