name: Prune Merged Branches

on:
  schedule:
    - cron: '0 9 * * 1'   # Every Monday 09:00 UTC
  workflow_dispatch:        # Manual trigger from Actions tab
  push:
    branches: [main]

concurrency:
  group: prune-branches
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Delete branches from merged PRs (squash/rebase-safe)
        run: |
          set -euo pipefail
          # Never touch these
          PROTECTED_REGEX='^(main|develop|master|HEAD)$'

          # gh pr list only sees open PRs by default; --state merged is required
          # to find branches whose PR was squash/rebase-merged (git branch
          # --merged misses these entirely since there's no ancestor commit).
          gh pr list --state merged --limit 500 --json headRefName,headRefOid,number \
            --jq '.[] | "\(.headRefName)\t\(.number)\t\(.headRefOid)"' \
            | while IFS=$'\t' read -r branch pr_number merged_sha; do
                [ -z "$branch" ] && continue
                if echo "$branch" | grep -qE "$PROTECTED_REGEX"; then
                  continue
                fi
                remote_sha=$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)
                [ -z "$remote_sha" ] && continue
                # Safety: only delete if the branch tip is exactly what was merged.
                # A reused branch name or commits pushed after merge must survive.
                if [ "$remote_sha" != "$merged_sha" ]; then
                  echo "Skipping $branch: tip $remote_sha != merged head $merged_sha (PR #$pr_number)"
                  continue
                fi
                echo "Deleting branch from merged PR #$pr_number: $branch"
                git push origin --delete "$branch" || true
              done

      - name: Delete plain fast-forward-merged branches
        run: |
          set -euo pipefail
          PROTECTED_REGEX='^(main|develop|master|HEAD)$'

          # Fallback for branches merged without going through a PR at all.
          MAIN_SHA=$(git rev-parse origin/main)
          OPEN_HEADS=$(gh pr list --state open --limit 500 --json headRefName --jq '.[].headRefName')
          git branch -r --merged origin/main \
            | sed 's|^ *origin/||' | grep -v -- '->' \
            | while read -r branch; do
                [ -z "$branch" ] && continue
                # Never delete a freshly created branch (tip == main) or one with an open PR.
                if [ "$(git rev-parse "origin/$branch")" = "$MAIN_SHA" ]; then
                  echo "Skipping fresh branch at main tip: $branch"; continue
                fi
                if printf '%s\n' "$OPEN_HEADS" | grep -qxF "$branch"; then
                  echo "Skipping $branch: has an open PR"; continue
                fi
                if echo "$branch" | grep -qE "$PROTECTED_REGEX"; then
                  continue
                fi
                echo "Deleting fast-forward-merged branch: $branch"
                git push origin --delete "$branch" || true
              done
