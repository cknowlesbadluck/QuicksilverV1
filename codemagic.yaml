# Codemagic CI configuration (iOS)
# Generates the Xcode project from project.yml before testing or archiving.

workflows:
  ios-default:
    name: iOS Build, Test & Archive
    max_build_duration: 120
    environment:
      xcode: latest
      vars:
        SCHEME: Quicksilver
        EXPORT_METHOD: ad-hoc
    scripts:
      - name: Generate Xcode project
        script: |
          set -euo pipefail
          brew install xcodegen || brew upgrade xcodegen
          xcodegen generate
          test -d Quicksilver.xcodeproj
      - name: Run unit tests (simulator)
        script: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{print $2; exit}')
          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone simulator found."
            exit 1
          fi
          xcodebuild test \
            -project Quicksilver.xcodeproj \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
      - name: Archive (device)
        script: |
          set -euo pipefail
          ARCHIVE_PATH="$CM_BUILD_DIR/$SCHEME.xcarchive"
          xcodebuild \
            -project Quicksilver.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -allowProvisioningUpdates \
            archive \
            -archivePath "$ARCHIVE_PATH"

          EXPORT_DIR="$CM_BUILD_DIR/export"
          mkdir -p "$EXPORT_DIR"
          if [ -f ExportOptions.plist ]; then
            xcodebuild \
              -exportArchive \
              -archivePath "$ARCHIVE_PATH" \
              -exportPath "$EXPORT_DIR" \
              -exportOptionsPlist ExportOptions.plist
          else
            EXPORT_OPTIONS="$CM_BUILD_DIR/ExportOptions.plist"
            cat > "$EXPORT_OPTIONS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${EXPORT_METHOD}</string>
            <key>compileBitcode</key>
            <false/>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          EOF
            xcodebuild \
              -exportArchive \
              -archivePath "$ARCHIVE_PATH" \
              -exportPath "$EXPORT_DIR" \
              -exportOptionsPlist "$EXPORT_OPTIONS"
          fi
    artifacts:
      - "$CM_BUILD_DIR/export/*.ipa"
    publishing:
      scripts:
        - name: Print artifact path
          script: |
            echo "Exported artifacts are in: $CM_BUILD_DIR/export"
            ls -la "$CM_BUILD_DIR/export" || true
